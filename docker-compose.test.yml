services:
  postgres-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ebg
      POSTGRES_PASSWORD: ebg
      POSTGRES_DB: ebg_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebg"]
      interval: 2s
      timeout: 3s
      retries: 15